[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anki-multisource-vocab"
version = "0.1.0"
description = "Build globally deduplicated Japanese Anki vocabulary queues from video subtitles."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fugashi>=1.3.0",
  "unidic-lite>=1.0.8",
  "wordfreq>=3.1.1",
  "mecab-python3>=1.0.10",
  "ipadic>=1.0.0",
  "jamdict>=0.1a11.post2",
  "jamdict-data>=1.5",
  "sentence-transformers>=3.0.0,<6.0.0",
  "sudachipy>=0.6.8,<0.7.0",
  "sudachidict-core>=20240109",
  "pyopenjtalk>=0.4.0,<0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
reading-full = ["sudachidict-full>=20240109"]

[project.scripts]
vocabdeck = "vocabdeck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vocabdeck"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
